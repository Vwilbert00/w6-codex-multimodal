<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image-to-Text</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <h1>Image-to-Text</h1>

    <label for="image-input">Image 1:</label>
    <input type="file" id="image-input" accept="image/*">

    <section>
      <h2>Image 1 Preview</h2>
      <div id="image-preview"></div>
    </section>

    <label for="image-input-2">Image 2:</label>
    <input type="file" id="image-input-2" accept="image/*">

    <section>
      <h2>Image 2 Preview</h2>
      <div id="image-preview-2"></div>
    </section>

    <button type="button" id="describe-button">Describe Image</button>

    <section>
      <h2>AI-Generated Description</h2>
      <div id="description"></div>
    </section>
  </main>
</body>
</html>
